<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyaGov Cyber Lab</title>

  <style>
    body {
      margin: 0;
      background: #080808;
      color: #eee;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 30px;
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #333;
      background: #080808;
      color: white;
    }

    button {
      cursor: pointer;
      background: #eee;
      color: #000;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>AyaGov 🇮🇩</h1>
    <p>Cybersecurity Practice Lab</p>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <div id="result"></div>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");

      if (username === "admin" && password === "ayagov2026") {
        result.textContent = "ACCESS GRANTED 🟢";
      } else {
        result.textContent = "ACCESS DENIED 🔴";
      }
    }
  </script>

</body>
</html>
